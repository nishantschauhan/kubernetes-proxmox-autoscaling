apiVersion: v1
data:
  thesis-dashboard.json: "{\n  \"title\": \"Thesis \u2014 Autoscaling\",\n  \"uid\"\
    : \"thesis-autoscaling\",\n  \"timezone\": \"browser\",\n  \"schemaVersion\":\
    \ 39,\n  \"refresh\": \"5s\",\n  \"time\": { \"from\": \"now-30m\", \"to\": \"\
    now\" },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Ready nodes\"\
    ,\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12,\
    \ \"x\": 0, \"y\": 0 },\n      \"targets\": [\n        {\n          \"expr\":\
    \ \"sum(kube_node_status_condition{condition=\\\"Ready\\\",status=\\\"true\\\"\
    })\",\n          \"legendFormat\": \"ready nodes (control plane + workers)\"\n\
    \        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Pending\
    \ pods (the autoscaler's trigger signal)\",\n      \"type\": \"timeseries\",\n\
    \      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 0 },\n      \"targets\"\
    : [\n        {\n          \"expr\": \"sum(kube_pod_status_phase{phase=\\\"Pending\\\
    \"})\",\n          \"legendFormat\": \"pending pods\"\n        }\n      ]\n  \
    \  },\n    {\n      \"id\": 3,\n      \"title\": \"CPU utilisation per node\"\
    ,\n      \"type\": \"timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12,\
    \ \"x\": 0, \"y\": 8 },\n      \"targets\": [\n        {\n          \"expr\":\
    \ \"100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\\\"idle\\\"}[1m]))\
    \ * 100)\",\n          \"legendFormat\": \"{{instance}}\"\n        }\n      ]\n\
    \    },\n    {\n      \"id\": 4,\n      \"title\": \"Workload pod network I/O\
    \ (JMeter-driven traffic proxy)\",\n      \"description\": \"No JMeter->Prometheus\
    \ backend listener is wired up in this setup, so true client-observed request\
    \ rate/latency is not available here \u2014 see results/jmeter-*.jtl for that.\
    \ This panel uses container network throughput on the workload pods as an in-cluster\
    \ proxy for traffic volume/continuity during a scale-up.\",\n      \"type\": \"\
    timeseries\",\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 8 },\n\
    \      \"targets\": [\n        {\n          \"expr\": \"sum(rate(container_network_receive_bytes_total{namespace=\\\
    \"default\\\"}[1m])) by (pod)\",\n          \"legendFormat\": \"{{pod}} rx bytes/s\"\
    \n        }\n      ]\n    }\n  ]\n}\n"
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: '1'
  name: thesis-grafana-dashboard
  namespace: monitoring
