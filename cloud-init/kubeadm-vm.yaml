hostname: ${hostname}
manage_etc_hosts: true

users:
  - name: ubuntu
    groups: [adm, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}

swap:
  filename: ""

write_files:
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

  - path: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

  - path: /var/log/thesis-boot-start
    content: |
      bootstrap_initiated

runcmd:
  - date +%s%3N > /var/log/thesis-t-boot-start

  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system
  - swapoff -a
  - sed -i '/ swap / s/^/#/' /etc/fstab

  # --- Install containerd (the CRI runtime kubeadm expects) --------------
  - apt-get update
  - apt-get install -y apt-transport-https ca-certificates curl gpg containerd
  - mkdir -p /etc/containerd
  - containerd config default > /etc/containerd/config.toml
  # kubelet and containerd must agree on the cgroup driver, or kubelet fails
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable containerd

  # --- Install kubeadm / kubelet / kubectl -------------------------------
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/${k8s_minor_version}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/${k8s_minor_version}/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
  - apt-get update
  - apt-get install -y kubelet kubeadm kubectl
  # Pin versions so an unattended upgrade cannot change the cluster mid-study
  - apt-mark hold kubelet kubeadm kubectl

  - |
    kubeadm join ${control_plane_endpoint} \
      --token ${kubeadm_token} \
      --discovery-token-ca-cert-hash sha256:${kubeadm_ca_hash} \
      --v=5 >> /var/log/thesis-bootstrap.log 2>&1

  # --- Timestamp: node has joined (T_joined) ------------------------------
  - date +%s%3N > /var/log/thesis-t-joined

final_message: "Thesis node bootstrap complete after $UPTIME seconds"
