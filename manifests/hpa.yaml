apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: thesis-workload-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: thesis-workload

  minReplicas: 1
  maxReplicas: 40 # high enough that HPA is never the limiting factor

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80 # <-- the threshold from Chapter 4

  behavior:
    scaleUp:
      # Zero stabilisation window: react immediately so that measured
      # time-to-scale reflects PROVISIONING time, not HPA hesitation.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      # Long window on the way down to avoid thrashing between test runs
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
