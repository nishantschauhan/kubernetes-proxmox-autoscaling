apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: thesis-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.67.240-192.168.67.245
  autoAssign: true
---
# --- Announce that pool over Layer2 (ARP) on all nodes ----------------------
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: thesis-l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - thesis-pool
