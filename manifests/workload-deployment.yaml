kind: Deployment
metadata:
  name: thesis-workload
  namespace: default
  labels:
    app: thesis-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thesis-workload
  template:
    metadata:
      labels:
        app: thesis-workload
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
    spec:
      containers:
        - name: workload
          # php-apache is the canonical HPA demo image: a CPU-burning endpoint
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 200m # denominator for HPA + scheduler capacity unit
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: thesis-workload
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: thesis-workload
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

      nodePort: 30080
