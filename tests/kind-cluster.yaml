kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: thesis-test

nodes:
  # Single small worker. Keeping capacity LOW is deliberate: it makes pods go
  # Pending quickly, which is exactly the condition the watcher must detect.
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            # Artificially cap capacity so a handful of pods fills the node.
            # This simulates "cluster is full" without needing real hardware.
            system-reserved: "cpu=500m,memory=500Mi"
            max-pods: "20"
    extraPortMappings:
      # Expose the workload so JMeter can reach it from the host
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
