

global
    log /var/run/log local0 info
    maxconn 20000
    daemon
   
    stats socket /var/run/haproxy.sock mode 660 level admin

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    retries 3
   
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s


resolvers cluster_dns
    nameserver internal 192.168.1.1:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
 
    hold valid 5s
    hold other 5s
    hold refused 5s
    hold nx 5s


listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-node


frontend web_in
    bind *:80
  S
    default_backend k8s_workers


backend k8s_workers
    balance roundrobin         
    option httpchk GET /
    http-check expect status 200

   
    server-template worker 1-10 k8s-node.thesis.local:30080 \
        check resolvers cluster_dns init-addr none

