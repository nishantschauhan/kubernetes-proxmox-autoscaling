
ext_if  = "vtnet0"                 
int_if  = "vtnet1"                 # internal link toward Proxmox
node_net    = "192.168.1.0/24"     # Kubernetes nodes
service_net = "192.168.1.200/29"   # MetalLB service pool
proxmox_mgmt = "192.168.1.10"      # Proxmox API/management address
admin_net   = "192.168.1.0/24"     # where your laptop connects from


table <bruteforce> persist        -
set skip on lo0
set block-policy drop             
set loginterface $ext_if
scrub in all fragment reassemble    

# ===========================================================================
# DEFAULT DENY — everything not explicitly permitted below is blocked
# ===========================================================================
block in log all
block out log all

pass out quick on $ext_if all keep state

block quick from <bruteforce>


pass in quick on $ext_if proto tcp to $service_net port { 80, 443 } \
     flags S/SA keep state

# Administrative SSH, rate-limited: 5 connections per 30s per source, then ban
pass in quick on $ext_if proto tcp from $admin_net to ($ext_if) port 22 \
     flags S/SA keep state \
     (max-src-conn 10, max-src-conn-rate 5/30, overload <bruteforce> flush global)

# ICMP echo for diagnostics only
pass in quick on $ext_if inet proto icmp icmp-type echoreq keep state

y.
pass in quick on $int_if proto tcp from $node_net to ($int_if) port 179 \
     flags S/SA keep state

# HAProxy reaching the worker nodes
pass out quick on $int_if proto tcp from ($int_if) to $node_net \
     keep state

# Laptop -> Proxmox API (OpenTofu runs over this) and Proxmox web UI
pass in quick on $int_if proto tcp from $admin_net to $proxmox_mgmt port 8006 \
     flags S/SA keep state

# Kubernetes API server access for kubectl from the admin network
pass in quick on $int_if proto tcp from $admin_net to $node_net port 6443 \
     flags S/SA keep state

# General internal traffic between nodes (cluster networking, CNI)
pass quick on $int_if from $node_net to $node_net keep state
