
! This is the EDGE half of the BGP peering. Its counterpart is
! manifests/metallb-config.yaml inside the cluster.
!
! ROLE IN THE SYSTEM: FRRouting learns, from MetalLB, which service IPs are
! currently reachable inside the cluster. When the Cluster Autoscaler adds a
! node and MetalLB re-advertises, FRRouting updates the gateway's routing
! table automatically — no operator action, no dropped connections. That is
! the "zero-downtime network synchronisation" requirement (FR-3).
!
! Install on FreeBSD:  pkg install frr9
! Config path:         /usr/local/etc/frr/frr.conf
! Enable:              sysrc frr_enable=YES && service frr start
! ===========================================================================

frr version 9.1
frr defaults traditional
hostname thesis-edge-gw
log file /var/log/frr/frr.log informational
log timestamp precision 3
!
! --- BGP process: the gateway's own ASN -----------------------------------
! Must match `peerASN` in metallb-config.yaml
router bgp 64513
 bgp router-id 192.168.1.1
 ! We are a route REFLECTOR/collector here, not a transit router:
 ! we only accept what the cluster tells us.
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 !
 ! --- Neighbour: the MetalLB speakers running on the Kubernetes nodes -----
 ! A peer-group lets any node in the cluster peer without editing this file
 ! each time the cluster scales — essential for autoscaling.
 neighbor METALLB peer-group
 neighbor METALLB remote-as 64512
 neighbor METALLB timers 3 9
 ! Accept sessions from any host in the node subnet. This is what allows a
 ! NEWLY PROVISIONED node to establish BGP without manual configuration.
 bgp listen range 192.168.1.0/24 peer-group METALLB
 !
 address-family ipv4 unicast
  ! Learn service routes from MetalLB; advertise nothing back to it.
  neighbor METALLB activate
  neighbor METALLB soft-reconfiguration inbound
  ! Safety: never accept a default route or anything outside the service pool
  neighbor METALLB prefix-list ONLY-SERVICE-POOL in
 exit-address
!
! --- Only accept advertisements for the MetalLB service pool --------------
ip prefix-list ONLY-SERVICE-POOL seq 10 permit 192.168.1.200/29 le 32
ip prefix-list ONLY-SERVICE-POOL seq 99 deny any
!
line vty
!
